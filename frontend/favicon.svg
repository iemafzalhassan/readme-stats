<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="64" height="64" rx="16" fill="#09090B"/>
  <defs>
    <linearGradient id="cubeGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <!-- Outer Isometric Hexagon Cube -->
  <polygon points="32,6 56,19.5 56,44.5 32,58 8,44.5 8,19.5" fill="#121218" stroke="url(#cubeGrad)" stroke-width="3"/>
  <!-- Inner Isometric Y-Split -->
  <path d="M8 19.5 L32 33 L56 19.5 M32 33 V58" stroke="url(#cubeGrad)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top Diamond Accent -->
  <polygon points="32,12 46,19.5 32,27 18,19.5" fill="url(#cubeGrad)" fill-opacity="0.35"/>
  <!-- Left Face Telemetry Bars -->
  <rect x="14" y="36" width="3.2" height="9" rx="1" fill="#6366F1"/>
  <rect x="19" y="32" width="3.2" height="13" rx="1" fill="#38BDF8"/>
  <rect x="24" y="38" width="3.2" height="7" rx="1" fill="#10B981"/>
  <!-- Right Face Terminal Prompt >_ -->
  <path d="M38 35 L43 39 L38 43" stroke="#10B981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="45" y1="43" x2="50" y2="40.5" stroke="#38BDF8" stroke-width="2.4" stroke-linecap="round"/>
</svg>
